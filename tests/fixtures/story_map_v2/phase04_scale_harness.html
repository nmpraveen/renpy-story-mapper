<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Story Map V2 scale harness</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", sans-serif; background: #f4f1eb; color: #25231f; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input { font: inherit; }
    button { min-height: 2.25rem; border: 1px solid #817b70; background: #fff; padding: .35rem .65rem; color: inherit; }
    button:focus-visible, input:focus-visible { outline: 3px solid #7c3aed; outline-offset: 2px; }
    header { position: sticky; top: 0; z-index: 3; display: grid; gap: .6rem; border-bottom: 1px solid #c8c1b5; background: #fff; padding: .75rem clamp(.75rem, 3vw, 2rem); }
    h1 { margin: 0; font: 400 clamp(1.35rem, 3vw, 2rem) Georgia, serif; }
    .commands { display: flex; flex-wrap: wrap; gap: .45rem; align-items: center; }
    .commands label { display: inline-flex; gap: .35rem; align-items: center; }
    .badge { display: inline-block; border: 1px solid currentColor; padding: .1rem .35rem; font-size: .72rem; font-weight: 700; letter-spacing: .04em; }
    .badge--stale { color: #9a3412; }
    .badge--new { color: #6d28d9; }
    main { width: min(72rem, 100%); margin: 0 auto; padding: clamp(.75rem, 3vw, 2rem); }
    #section-index { display: flex; gap: .35rem; overflow-x: auto; padding-bottom: .65rem; }
    #section-index button { flex: 0 0 auto; }
    #story { display: grid; gap: .75rem; }
    .story-node { min-width: 0; border: 1px solid #c8c1b5; border-left: 4px solid #514b42; background: #fff; padding: .75rem; overflow-wrap: anywhere; }
    .story-node[data-kind="choice"], .story-node[data-kind="arm"] { border-left-color: #7c3aed; }
    .story-node[data-selected="true"] { box-shadow: 0 0 0 3px #f59e0b; }
    .story-node h2 { margin: 0; font: 400 1.1rem Georgia, serif; }
    .story-node p { margin: .35rem 0; color: #625d54; }
    .node-actions { display: flex; flex-wrap: wrap; gap: .35rem; }
    #side-panel { position: fixed; inset: auto 1rem 1rem auto; z-index: 4; width: min(28rem, calc(100vw - 2rem)); max-height: calc(100vh - 2rem); overflow: auto; border: 1px solid #817b70; background: #fff; padding: 1rem; box-shadow: .5rem .5rem 0 #d6d0c6; }
    #side-panel[hidden] { display: none; }
    #side-panel h2 { margin-top: 0; }
    #status { min-height: 1.25rem; color: #625d54; }
    @media (max-width: 480px) {
      header { position: static; }
      .commands { align-items: stretch; }
      .commands > * { flex: 1 1 9rem; }
      main { padding: .65rem; }
      #side-panel { inset: .5rem; width: auto; max-height: calc(100vh - 1rem); }
    }
  </style>
</head>
<body>
  <header>
    <div><h1 id="title">Full story</h1> <span id="freshness" class="badge">Loading</span></div>
    <div class="commands">
      <button id="search-final" type="button">Find final target</button>
      <button id="oversized-branch" type="button">Open large branch</button>
      <button id="cross-rejoin" type="button">Cross-section rejoin</button>
      <button id="refresh" type="button">Refresh</button>
      <button id="reopen" type="button">Reopen</button>
      <label><input id="hide-new" type="checkbox"> Hide NEW</label>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
  </header>
  <main>
    <nav id="section-index" aria-label="Story sections"></nav>
    <section id="story" aria-label="Hydrated story window"></section>
  </main>
  <aside id="side-panel" hidden aria-label="Path and detail"></aside>
  <script type="module" src="/harness.js"></script>
</body>
</html>
